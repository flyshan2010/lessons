<!DOCTYPE html>
<html lang="zh-Hant" data-subject="society">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>四季臺灣 3D 地圖</title>
<style>
/* ===== 教學 Design System（內嵌，勿手改；改請回正本重新打包） ===== */
/* ============================================================
   教學 Design System · tokens.css  v1.0
   基準設計尺：1600 × 900（16:9 投影）
   用法：在 <html> 或 .stage 上加 data-subject="chinese|math|
   nature|society|health|art"，主題即整份切換。
   鐵則：面向學生的文字一律 ≥ 24px；語意色不隨主題變。
   ============================================================ */

:root {
  /* ---------- 版面骨架 ---------- */
  --stage-w: 1600;
  --stage-h: 900;
  --safe-x: 96px;          /* 左右安全區 */
  --safe-y: 64px;          /* 上下安全區 */
  --header-h: 92px;        /* 頁首帶 */
  --footer-h: 76px;        /* 頁尾判斷帶 */

  /* ---------- 字級階梯（投影用，勿低於 T5） ---------- */
  --t1: 80px;              /* 核心判斷／單一大字 72–88 */
  --t2: 56px;              /* 頁標題 52–60 */
  --t3: 38px;              /* 區塊標／欄標 36–40 */
  --t4: 30px;              /* 內文／表格主文 28–32 */
  --t5: 24px;              /* 標籤／註記（硬性下限） */
  --t-min: 24px;           /* 驗證器據此檢查 */

  --lh-tight: 1.15;
  --lh-normal: 1.45;
  --lh-loose: 1.7;

  --fw-regular: 400;
  --fw-bold: 700;

  --font-sans: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC",
               "Heiti TC", system-ui, sans-serif;
  --font-hand: "Chalkduster", "Bradley Hand", var(--font-sans);

  /* ---------- 間距尺（8 的倍數） ---------- */
  --s1: 8px;
  --s2: 16px;
  --s3: 24px;
  --s4: 32px;
  --s5: 48px;
  --s6: 64px;
  --s7: 96px;

  /* ---------- 線寬／圓角／陰影（各三級） ---------- */
  --line-thin: 1px;
  --line-mid: 2px;
  --line-bold: 4px;

  --r-sm: 6px;
  --r-md: 14px;
  --r-lg: 24px;

  --shadow-1: 0 1px 3px rgba(0, 0, 0, .08);
  --shadow-2: 0 4px 14px rgba(0, 0, 0, .10);
  --shadow-3: 0 12px 32px rgba(0, 0, 0, .14);

  /* ---------- 語意色：跨主題固定，不得覆寫 ----------
     鐵則：語意一律「顏色 + 圖示（或文字）」雙軌呈現，不得只靠顏色。
     色覺障礙學生看不出紅綠差別；投影機色偏也會讓暖色系互相靠近。
     正確 → ✓ / #ico-check   錯誤 → ✗ / #ico-cross   提醒 → ⚠ / #ico-warn
     ------------------------------------------------------- */
  --correct: #1B7A3E;
  --correct-soft: #E6F3EA;
  --wrong: #C0322B;
  --wrong-soft: #FBEAE9;
  --warn: #8A6100;
  --warn-soft: #FBF2DC;
  --neutral-soft: #EFEFEF;

  /* ---------- 動畫：白名單三用途 ---------- */
  --dur-fast: 200ms;
  --dur-base: 300ms;
  --dur-slow: 400ms;
  --ease: cubic-bezier(.22, .61, .36, 1);

  /* ---------- 預設主題（無 data-subject 時＝通用教學） ---------- */
  --bg: #F8F8F7;
  --surface: #FFFFFF;
  --ink: #1A1A1A;
  --muted: #5C5C5C;
  --line: #D6D4CF;
  --accent: #B4441F;
  --accent-soft: #FBEDE7;
  --accent-2: #2B5680;
  --texture: none;
}

/* ============================================================
   六科主題（層 1：由科目決定色彩／質感）
   每組皆已驗過：ink/bg ≥ 7:1、accent/bg ≥ 4.5:1
   ============================================================ */

/* 國語：宣紙米白 + 墨黑 + 硃紅 */
[data-subject="chinese"] {
  --bg: #FAF7F0;
  --surface: #FFFDF8;
  --ink: #1C1A17;
  --muted: #5E574C;
  --line: #DED5C4;
  --accent: #B23A2E;
  --accent-soft: #F7E9E5;
  --accent-2: #5A6B7A;   /* 墨青：與 --warn 拉開，避免「次重點」被誤讀成「注意」 */
  --texture: none;
}

/* 數學：淨白 + 靛藍 + 橘 */
[data-subject="math"] {
  --bg: #FBFCFD;
  --surface: #FFFFFF;
  --ink: #16202B;
  --muted: #556575;
  --line: #D3DDE7;
  --accent: #1F5FA8;
  --accent-soft: #E8F0F9;
  --accent-2: #7A3D9A;   /* 深紫：原橙對比僅 4.03 且撞 --warn，已改 */
  --texture: grid;
}

/* 自然：淺灰白 + 森綠 + 琥珀 */
[data-subject="nature"] {
  --bg: #F7F9F6;
  --surface: #FFFFFF;
  --ink: #16201A;
  --muted: #506055;
  --line: #D2DFD3;
  --accent: #1E6B45;
  --accent-soft: #E7F2EB;
  --accent-2: #205C7A;   /* 深青藍：原琥珀與 --warn 撞色，已改 */
  --texture: none;
}

/* 社會：牛皮紙 + 深褐 + 靛 */
[data-subject="society"] {
  --bg: #FAF6EE;
  --surface: #FFFCF6;
  --ink: #241E16;
  --muted: #6A5B49;
  --line: #DCCFB8;
  --accent: #2B5680;
  --accent-soft: #E7EEF5;
  --accent-2: #6B4423;   /* 加深土褐：與 --warn 拉開 */
  --texture: paper;
}

/* 健體：明亮白 + 深青 + 活力橙 */
[data-subject="health"] {
  --bg: #FBFDFD;
  --surface: #FFFFFF;
  --ink: #14201F;
  --muted: #4F6362;
  --line: #CFE0DF;
  --accent: #0E6B6B;
  --accent-soft: #E4F2F1;
  --accent-2: #B0355F;   /* 桃紅：原橙對比僅 4.44 且撞 --warn，已改 */
  --texture: none;
}

/* 藝文：低彩灰 + 炭黑 + 紫（accent 可依作品取樣覆寫） */
[data-subject="art"] {
  --bg: #F8F7F6;
  --surface: #FFFFFF;
  --ink: #1B1A19;
  --muted: #5C5859;
  --line: #DAD6D4;
  --accent: #6B4E8C;
  --accent-soft: #F0EBF5;
  --accent-2: #45607A;   /* 炭青：與 --warn 拉開 */
  --texture: canvas;
}

/* ============================================================
   質感層（極輕，不干擾閱讀）
   ============================================================ */
[data-subject="math"] .stage::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(31, 95, 168, .05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(31, 95, 168, .05) 1px, transparent 1px);
  background-size: 64px 64px;
}

[data-subject="society"] .stage::before,
[data-subject="art"] .stage::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .35;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(138, 90, 43, .05) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 60%, rgba(138, 90, 43, .04) 0 2px, transparent 3px);
  background-size: 180px 180px;
}

/* ============================================================
   基礎排版
   ============================================================ */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #222;
  font-family: var(--font-sans);
  color: var(--ink);
}

.stage {
  position: relative;
  width: 1600px;
  height: 900px;
  background: var(--bg);
  overflow: hidden;
}

.slide {
  position: absolute;
  inset: 0;
  padding: var(--safe-y) var(--safe-x);
  display: flex;
  flex-direction: column;
  gap: var(--s4);
}

h1, h2, h3, p, ul, ol { margin: 0; }

.t1 { font-size: var(--t1); line-height: var(--lh-tight); font-weight: var(--fw-bold); }
.t2 { font-size: var(--t2); line-height: var(--lh-tight); font-weight: var(--fw-bold); }
.t3 { font-size: var(--t3); line-height: var(--lh-normal); font-weight: var(--fw-bold); }
.t4 { font-size: var(--t4); line-height: var(--lh-normal); }
.t5 { font-size: var(--t5); line-height: var(--lh-normal); color: var(--muted); }

.ink { color: var(--ink); }
.muted { color: var(--muted); }
.em { color: var(--accent); font-weight: var(--fw-bold); }

/* ============================================================
   動畫白名單：只有這三種用途
   1. reveal   逐步揭露
   2. step-on  流程演示（步驟點亮）
   3. focus    聚焦重點（其餘降透明）
   ============================================================ */
[data-reveal] {
  opacity: 0;
  transform: translateY(12px);
  transition: opacity var(--dur-base) var(--ease),
              transform var(--dur-base) var(--ease);
}
[data-reveal].is-shown { opacity: 1; transform: none; }

.is-dimmed {
  opacity: .28;
  transition: opacity var(--dur-base) var(--ease);
}

.is-active-step {
  border-color: var(--accent) !important;
  background: var(--accent-soft);
  transition: background var(--dur-fast) var(--ease),
              border-color var(--dur-fast) var(--ease);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    transition-duration: .001ms !important;
  }
  [data-reveal] { opacity: 1; transform: none; }
}

@media print {
  [data-reveal] { opacity: 1 !important; transform: none !important; }
  .is-dimmed { opacity: 1 !important; }
  .slide { page-break-after: always; }
}
/* ============================================================
   教學 Design System · components.css  v1.0
   靜態元件 10 個 + 互動元件 5 個
   依賴 tokens.css。所有尺寸以 1600×900 設計尺為準。
   ============================================================ */

/* ---------- 共用：頁首帶／頁尾判斷帶 ---------- */
.page-head {
  display: flex;
  align-items: baseline;
  gap: var(--s3);
  min-height: var(--header-h);
  border-bottom: var(--line-mid) solid var(--line);
  padding-bottom: var(--s2);
}
.page-head .label {
  font-size: var(--t5);
  color: var(--accent);
  font-weight: var(--fw-bold);
  letter-spacing: .08em;
}
.page-head .title { font-size: var(--t2); font-weight: var(--fw-bold); }
.page-meta {
  position: absolute;
  right: var(--safe-x);
  bottom: var(--s3);
  font-size: var(--t5);
  color: var(--muted);
}

/* 直屬投影片的主要內容區塊撐滿可用高度，避免內容擠在上方、下半頁大片留白。
   .takeaway-band 靠自身的 margin-top:auto 貼底，不受影響。 */
.slide > .compare-pair,
.slide > .flow-steps,
.slide > .misconception,
.slide > .figure-block,
.slide > .timeline,
.slide > .question-frame,
.slide > .drag-match,
.slide > .section-divider,
.slide > .data-focus,
.slide > .action-list,
.slide > .slide-body { flex: 1; min-height: 0; }
.slide > .section-divider,
.slide > .data-focus { justify-content: center; }

.slide > .question-frame { justify-content: center; }

/* ---------- 1. 概念卡 concept-card ---------- */
.concept-card {
  background: var(--surface);
  border: var(--line-thin) solid var(--line);
  border-left: var(--line-bold) solid var(--accent);
  border-radius: var(--r-md);
  padding: var(--s4);
  box-shadow: var(--shadow-1);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.concept-card > .head { font-size: var(--t3); font-weight: var(--fw-bold); }
.concept-card > .body { font-size: var(--t4); color: var(--ink); }

/* ---------- 2. 對照組 compare-pair ---------- */
.compare-pair {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: stretch;
  gap: var(--s3);
}
.compare-pair.stacked { grid-template-columns: 1fr; }
.compare-pair > .side {
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.compare-pair > .side > .head {
  font-size: var(--t3);
  font-weight: var(--fw-bold);
  padding-bottom: var(--s1);
  border-bottom: var(--line-thin) solid var(--line);
}
.compare-pair > .side > .item { font-size: var(--t4); }
.compare-pair > .side.is-focus { border-color: var(--accent); background: var(--accent-soft); }
.compare-pair > .vs {
  align-self: center;
  font-size: var(--t3);
  font-weight: var(--fw-bold);
  color: var(--accent);
}

/* ---------- 3. 流程列 flow-steps ---------- */
.flow-steps { display: flex; align-items: stretch; gap: var(--s2); }
.flow-steps.vertical { flex-direction: column; }
.flow-steps > .step {
  flex: 1;
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s3);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.flow-steps > .step > .badge {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: var(--t3);
  font-weight: var(--fw-bold);
  display: grid;
  place-items: center;
}
.flow-steps > .step > .head { font-size: var(--t3); font-weight: var(--fw-bold); }
.flow-steps > .step > .body { font-size: var(--t4); color: var(--muted); }
.flow-steps > .arrow {
  align-self: center;
  color: var(--accent);
  font-size: var(--t2);
  line-height: 1;
}

/* ---------- 4. 時間軸 timeline ---------- */
.timeline { position: relative; padding-left: var(--s6); }
.timeline::before {
  content: "";
  position: absolute;
  left: 26px;
  top: 8px;
  bottom: 8px;
  width: var(--line-bold);
  background: var(--line);
  border-radius: 2px;
}
.timeline > .node {
  position: relative;
  padding: 0 0 var(--s4) 0;
  display: flex;
  flex-direction: column;
  gap: var(--s1);
}
.timeline > .node::before {
  content: "";
  position: absolute;
  left: -50px;
  top: 10px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--accent);
  border: var(--line-bold) solid var(--bg);
}
.timeline > .node > .when { font-size: var(--t5); color: var(--accent); font-weight: var(--fw-bold); }
.timeline > .node > .what { font-size: var(--t4); font-weight: var(--fw-bold); }
.timeline > .node > .note { font-size: var(--t5); color: var(--muted); }

/* ---------- 5. 詞彙卡 vocab-card ---------- */
.vocab-card {
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s1);
  min-width: 300px;
}
.vocab-card > .word {
  font-size: var(--t2);
  font-weight: var(--fw-bold);
  display: flex;
  align-items: baseline;
  gap: var(--s2);
}
.vocab-card > .word > .zhuyin {
  font-size: var(--t5);
  color: var(--accent);
  font-weight: var(--fw-regular);
}
.vocab-card > .mean { font-size: var(--t4); }
.vocab-card > .example {
  font-size: var(--t5);
  color: var(--muted);
  border-left: var(--line-mid) solid var(--line);
  padding-left: var(--s2);
}

/* ---------- 6. 任務卡 task-card ---------- */
.task-card {
  background: var(--accent-soft);
  border: var(--line-mid) solid var(--accent);
  border-radius: var(--r-lg);
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s3);
}
.task-card > .mission { font-size: var(--t2); font-weight: var(--fw-bold); }
.task-card > .facts {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2) var(--s5);
}
.task-card > .facts > .fact {
  font-size: var(--t4);
  display: flex;
  align-items: center;
  gap: var(--s1);
}
.task-card > .facts > .fact > .k {
  font-size: var(--t5);
  color: var(--muted);
  font-weight: var(--fw-bold);
}

/* ---------- 7. 迷思澄清框 misconception ---------- */
.misconception { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--s3); align-items: stretch; }
.misconception > .wrong-side,
.misconception > .right-side {
  border-radius: var(--r-md);
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.misconception > .wrong-side { background: var(--wrong-soft); border: var(--line-mid) solid var(--wrong); }
.misconception > .right-side { background: var(--correct-soft); border: var(--line-mid) solid var(--correct); }
.misconception .mark,
.misconception > .wrong-side > .head,
.misconception > .right-side > .head { font-size: var(--t3); font-weight: var(--fw-bold); }
.misconception > .wrong-side .mark,
.misconception > .wrong-side > .head { color: var(--wrong); }
.misconception > .right-side .mark,
.misconception > .right-side > .head { color: var(--correct); }
.misconception .text,
.misconception > .wrong-side > .body,
.misconception > .right-side > .body { font-size: var(--t4); }
.misconception > .becomes {
  align-self: center;
  font-size: var(--t2);
  color: var(--muted);
}

/* ---------- 8. 重點判斷帶 takeaway-band ---------- */
.takeaway-band {
  margin-top: auto;
  background: var(--surface);
  border: var(--line-mid) solid var(--accent);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  display: flex;
  align-items: center;
  gap: var(--s3);
  min-height: var(--footer-h);
}
.takeaway-band > .icon { font-size: var(--t3); color: var(--accent); }
.takeaway-band > .text { font-size: var(--t3); font-weight: var(--fw-bold); }

/* ---------- 9. 圖文區塊 figure-block ---------- */
.figure-block { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); align-items: center; }
.figure-block.figure-top { grid-template-columns: 1fr; }
.figure-block > .figure {
  background: var(--surface);
  border: var(--line-thin) solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s3);
  display: grid;
  place-items: center;
  min-height: 320px;
}
.figure-block > .figure svg,
.figure-block > .figure img { max-width: 100%; max-height: 420px; }
.figure-block > .caption { display: flex; flex-direction: column; gap: var(--s2); }
.figure-block > .caption > .head { font-size: var(--t3); font-weight: var(--fw-bold); }
.figure-block > .caption > .body { font-size: var(--t4); }

/* ---------- 10. 三層提問框 question-frame ---------- */
.question-frame { display: flex; flex-direction: column; gap: var(--s3); }
.question-frame > .q {
  background: var(--surface);
  border: var(--line-thin) solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
}
.question-frame > .q > .tier {
  flex: none;
  font-size: var(--t5);
  font-weight: var(--fw-bold);
  color: #fff;
  background: var(--muted);
  border-radius: var(--r-sm);
  padding: 4px 12px;
}
.question-frame > .q.tier-3 > .tier { background: var(--accent); }
.question-frame > .q > .text { font-size: var(--t3); }

/* ---------- 11. 過場分隔頁 section-divider ----------
   段落之間的呼吸點。整頁只放一句，讓學生知道「換段了」。
   版型輪替鐵則：full-bleed 版型只用於封面／過場／結尾，內容頁不用。 */
.section-divider {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  gap: var(--s3);
  background: var(--accent-soft);
  border-left: var(--line-bold) solid var(--accent);
  border-radius: var(--r-lg);
  padding: var(--s6) var(--s7);
}
.section-divider > .kicker {
  font-size: var(--t3);
  font-weight: var(--fw-bold);
  color: var(--accent);
  letter-spacing: .05em;
}
.section-divider > .headline { font-size: var(--t1); font-weight: var(--fw-bold); line-height: var(--lh-tight); }
.section-divider > .sub { font-size: var(--t4); color: var(--muted); }

/* ---------- 12. 數據聚焦頁 data-focus ----------
   一個大數字（或一張圖）＋一句結論。重點數據不再埋在內文裡。 */
.data-focus { display: grid; grid-template-columns: auto 1fr; gap: var(--s5); align-items: center; }
.data-focus.stacked { grid-template-columns: 1fr; text-align: center; justify-items: center; }
.data-focus > .figure-num {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s1);
  padding: var(--s4) var(--s6);
  background: var(--surface);
  border: var(--line-bold) solid var(--accent);
  border-radius: var(--r-lg);
}
.data-focus > .figure-num > .num {
  font-size: var(--num-xl, 160px);   /* 刻意超過 T1：數據就是主角。RWD 會降階 */
  line-height: 1;
  font-weight: var(--fw-bold);
  color: var(--accent);
}
.data-focus > .figure-num > .unit { font-size: var(--t3); font-weight: var(--fw-bold); color: var(--muted); }
.data-focus > .readout { display: flex; flex-direction: column; gap: var(--s3); }
.data-focus > .readout > .claim { font-size: var(--t2); font-weight: var(--fw-bold); }
.data-focus > .readout > .note { font-size: var(--t4); color: var(--muted); }

/* ---------- 13. 行動／檢核頁 action-list ----------
   明確的下一步或檢核清單。方框＝待辦、✓＋綠底＝完成，顏色＋記號雙軌。 */
.action-list { display: flex; flex-direction: column; gap: var(--s2); }
.action-list > .head { font-size: var(--t2); font-weight: var(--fw-bold); margin-bottom: var(--s2); }
.action-list > .item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  background: var(--surface);
  border: var(--line-thin) solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s3) var(--s4);
  font-size: var(--t4);
  min-height: 64px;
}
.action-list > .item::before {
  content: "";
  flex: none;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border: var(--line-mid) solid var(--accent);
  border-radius: var(--r-sm);
  background: var(--surface);
  font-size: var(--t5); font-weight: var(--fw-bold);
}
.action-list > .item.is-done { color: var(--muted); }
.action-list > .item.is-done::before {
  content: "✓"; color: #fff; background: var(--correct); border-color: var(--correct);
}

/* 課堂書寫欄 .write-field（單一正本，簡報與教材網頁共用）
   用 contenteditable 而非 textarea，才能有作業本底線格。
   高度以 --field-h 固定（min == max），內容再長只在框內捲動，不撐破版面。
   line-height 必須等於底線格距，字才會坐在線上。 */
.write-field {
  --field-h: 84px;
  min-height: var(--field-h);
  max-height: var(--field-h);
  padding: 0 4px;
  overflow-y: auto;
  font-family: inherit;
  font-size: 28px;
  line-height: 42px;
  color: var(--ink);
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0 40px,
    var(--line) 40px 42px
  );
  outline: 0;
  cursor: text;
}
.write-field:empty::before {
  content: attr(data-placeholder);
  color: var(--muted);
  opacity: .7;
}
.write-field:focus {
  border-radius: var(--r-sm);
  box-shadow: inset 0 0 0 var(--line-mid) var(--accent);
}
@media print {
  .write-field { overflow: visible; box-shadow: none; }
  .write-field:empty::before { content: none; }
}

/* ============================================================
   互動元件（5 個）— 純 CSS/JS，離線可用
   ============================================================ */

/* ---------- I1. 翻牌 flip-card ---------- */
.flip-card {
  perspective: 1200px;
  width: 100%;
  min-height: 240px;
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
  font: inherit;
  text-align: left;
}
/* .inner 必須 display:block —— 若是 <span> 等 inline 元素，
   min-height／height 會完全失效，正反面會塌成小方塊、文字溢出卡片外。 */
.flip-card > .inner {
  display: block;
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 240px;
  transition: transform var(--dur-slow) var(--ease);
  transform-style: preserve-3d;
}
.flip-card.is-flipped > .inner { transform: rotateY(180deg); }
.flip-card .face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: var(--r-md);
  border: var(--line-mid) solid var(--line);
  background: var(--surface);
  padding: var(--s3);
  display: grid;
  place-items: center;
  text-align: center;
  /* 正面是「問題」，用 t3 而非 t1/t2：卡片欄寬有限，56px 會撐爆。
     每張卡建議至少 280px 寬。 */
  font-size: var(--t3);
  font-weight: var(--fw-bold);
  line-height: var(--lh-normal);
  overflow: hidden;
  overflow-wrap: break-word;
}
.flip-card .face.back {
  transform: rotateY(180deg);
  background: var(--accent-soft);
  border-color: var(--accent);
  font-size: var(--t4);
}
.flip-card:focus-visible { outline: var(--line-bold) solid var(--accent); outline-offset: 4px; }

/* ---------- I2. 抽題／抽人 picker ---------- */
.picker {
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s4);
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  align-items: center;
}
.picker > .display {
  font-size: var(--t1);
  font-weight: var(--fw-bold);
  color: var(--accent);
  min-height: 96px;
  display: grid;
  place-items: center;
  text-align: center;
}
.picker > .display.is-rolling { opacity: .55; }
.picker > .status { font-size: var(--t5); color: var(--muted); }

/* ---------- I3. 拖曳配對 drag-match ---------- */
.drag-match { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); }
.drag-match .pool { display: flex; flex-wrap: wrap; gap: var(--s2); align-content: flex-start; }
.drag-match .chip {
  font-size: var(--t4);
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s2) var(--s3);
  cursor: grab;
  user-select: none;
}
.drag-match .chip.is-dragging { opacity: .5; cursor: grabbing; }
.drag-match .chip.is-placed { cursor: default; }
.drag-match .zones { display: flex; flex-direction: column; gap: var(--s3); }
.drag-match .zone {
  border: var(--line-bold) dashed var(--line);
  border-radius: var(--r-md);
  padding: var(--s3);
  min-height: 120px;
  display: flex;
  flex-direction: column;
  gap: var(--s2);
}
.drag-match .zone > .zone-head { font-size: var(--t3); font-weight: var(--fw-bold); }
.drag-match .zone > .drop { display: flex; flex-wrap: wrap; gap: var(--s2); min-height: 48px; }
.drag-match .zone.is-over { border-color: var(--accent); background: var(--accent-soft); }
.drag-match .chip.is-correct { border-color: var(--correct); background: var(--correct-soft); color: var(--correct); }
.drag-match .chip.is-wrong { border-color: var(--wrong); background: var(--wrong-soft); color: var(--wrong); }

/* ---------- I4. 倒數計時 countdown ---------- */
.countdown {
  display: inline-flex;
  align-items: center;
  gap: var(--s3);
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--s2) var(--s4);
}
.countdown > .time {
  font-size: var(--t1);
  font-weight: var(--fw-bold);
  font-variant-numeric: tabular-nums;
  min-width: 200px;
  text-align: center;
}
.countdown.is-warning > .time { color: var(--warn); }
.countdown.is-done > .time { color: var(--wrong); }
.countdown.is-done { border-color: var(--wrong); background: var(--wrong-soft); }

/* ---------- I5. 加分板 score-board ---------- */
.score-board { display: flex; gap: var(--s3); flex-wrap: wrap; }
.score-board > .team {
  flex: 1;
  min-width: 200px;
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s3);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s2);
}
.score-board > .team > .name { font-size: var(--t3); font-weight: var(--fw-bold); }
.score-board > .team > .score {
  font-size: var(--t1);
  font-weight: var(--fw-bold);
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.score-board > .team.is-lead { border-color: var(--accent); background: var(--accent-soft); }
.score-board > .team > .ctrl { display: flex; gap: var(--s2); }

/* 共用按鈕 */
.ds-btn {
  font-family: inherit;
  font-size: var(--t4);
  font-weight: var(--fw-bold);
  color: var(--ink);
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-md);
  padding: var(--s1) var(--s3);
  cursor: pointer;
  min-width: 56px;
  min-height: 56px;
}
.ds-btn:hover { border-color: var(--accent); }
.ds-btn:focus-visible { outline: var(--line-bold) solid var(--accent); outline-offset: 3px; }
.ds-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }

@media print {
  .picker, .countdown, .score-board .ctrl, .ds-btn { display: none !important; }
  .flip-card > .inner { transform: none !important; }
  .flip-card .face.back { position: static; transform: none; backface-visibility: visible; }
}

/* ============================================================
   I6–I8 作答型互動元件（2026-07-21 新增）
   共通鐵則：正誤一律「顏色 ＋ 圖示」雙軌；可點區最小 56×56；
   字級不低於 --t5(24px)；滑鼠／觸控／鍵盤三種操作都要能完成。
   ============================================================ */

/* ---------- 作答結果回饋（三元件共用） ---------- */
.ans-feedback {
  display: none;
  align-items: center;
  gap: var(--s2);
  margin-top: var(--s3);
  padding: var(--s2) var(--s3);
  border-radius: var(--r-md);
  font-size: var(--t4);
  font-weight: var(--fw-bold);
  border: var(--line-mid) solid transparent;
}
.ans-feedback.is-shown { display: flex; }
.ans-feedback .ico { width: 1.2em; height: 1.2em; flex: none; }
.ans-feedback.is-correct { color: var(--correct); background: var(--correct-soft); border-color: var(--correct); }
.ans-feedback.is-wrong   { color: var(--wrong);   background: var(--wrong-soft);   border-color: var(--wrong); }

/* ---------- I6. 選擇題 quiz（單選／多選／是非） ---------- */
.quiz {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-lg);
}
.quiz > .q-stem,
.fillq > .q-stem {
  font-size: var(--t3);
  font-weight: var(--fw-bold);
  line-height: var(--lh-normal);
}
.quiz > .q-hint { font-size: var(--t5); color: var(--muted); }
.quiz > .q-options {
  display: grid;
  gap: var(--s2);
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}
.quiz[data-mode="tf"] > .q-options { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

.q-opt {
  display: flex;
  align-items: center;
  gap: var(--s2);
  text-align: left;
  font: inherit;
  font-size: var(--t4);
  line-height: var(--lh-normal);
  min-height: 56px;
  padding: var(--s2) var(--s3);
  background: var(--bg);
  color: var(--ink);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.q-opt:hover { border-color: var(--accent); }
.q-opt:focus-visible { outline: var(--line-bold) solid var(--accent); outline-offset: 3px; }

/* 選項前的標記格：未選為空框，已選填入記號 —— 不只靠底色表達「已選」 */
.q-opt::before {
  content: "";
  flex: none;
  width: 32px; height: 32px;
  border: var(--line-mid) solid var(--line);
  background: var(--surface);
}
.quiz[data-mode="multi"] .q-opt::before { border-radius: var(--r-sm); }
.quiz:not([data-mode="multi"]) .q-opt::before { border-radius: 50%; }
.q-opt.is-picked { border-color: var(--accent); background: var(--accent-soft); }
.q-opt.is-picked::before {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: inset 0 0 0 4px var(--surface);
}

/* 對答案後：顏色 ＋ 文字記號雙軌（::after 為圖示欄） */
.q-opt.is-correct { border-color: var(--correct); background: var(--correct-soft); color: var(--correct); }
.q-opt.is-wrong   { border-color: var(--wrong);   background: var(--wrong-soft);   color: var(--wrong); }
.q-opt.is-missed  { border-color: var(--correct); border-style: dashed; color: var(--correct); }
.q-opt.is-correct::after { content: "✓"; margin-left: auto; font-weight: var(--fw-bold); }
.q-opt.is-wrong::after   { content: "✗"; margin-left: auto; font-weight: var(--fw-bold); }
.q-opt.is-missed::after  { content: "（正解）"; margin-left: auto; font-size: var(--t5); }
.quiz.is-locked .q-opt { cursor: default; }

/* ---------- I7. 排列題 order ---------- */
.order-q {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-lg);
}
.order-q > .q-stem { font-size: var(--t3); font-weight: var(--fw-bold); }
.order-list {
  list-style: none;
  margin: 0; padding: 0;
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  counter-reset: ord;
}
.order-item {
  counter-increment: ord;
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--t4);
  line-height: var(--lh-normal);
  min-height: 56px;
  padding: var(--s2) var(--s3);
  background: var(--bg);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-md);
  cursor: grab;
}
.order-item::before {
  content: counter(ord);
  flex: none;
  width: 40px; height: 40px;
  display: grid; place-items: center;
  font-weight: var(--fw-bold);
  color: var(--surface);
  background: var(--accent);
  border-radius: 50%;
}
.order-item > .txt { flex: 1; min-width: 0; overflow-wrap: break-word; }
.order-item > .move {
  flex: none;
  width: 44px; height: 44px;
  display: grid; place-items: center;
  font: inherit; font-size: var(--t4);
  background: var(--surface);
  color: var(--ink);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-sm);
  cursor: pointer;
}
.order-item > .move:hover { border-color: var(--accent); }
.order-item > .move:focus-visible { outline: var(--line-bold) solid var(--accent); outline-offset: 2px; }
.order-item > .move[disabled] { opacity: .35; cursor: default; }
.order-item.is-dragging { opacity: .5; cursor: grabbing; }
.order-item.is-over { border-color: var(--accent); border-style: dashed; }
.order-item.is-correct { border-color: var(--correct); background: var(--correct-soft); }
.order-item.is-wrong   { border-color: var(--wrong);   background: var(--wrong-soft); }
.order-item.is-correct > .txt::after { content: " ✓"; color: var(--correct); font-weight: var(--fw-bold); }
.order-item.is-wrong   > .txt::after { content: " ✗"; color: var(--wrong);   font-weight: var(--fw-bold); }

/* ---------- I8. 圖標答題 hotspot ---------- */
.hotspot {
  display: flex;
  flex-direction: column;
  gap: var(--s3);
  padding: var(--s4);
  background: var(--surface);
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-lg);
}
.hotspot > .q-stem { font-size: var(--t3); font-weight: var(--fw-bold); }
.hotspot > .q-hint { font-size: var(--t5); color: var(--muted); }
.hs-stage {
  position: relative;
  align-self: center;
  max-width: 100%;
  line-height: 0;            /* 消除 img 底部行距，讓座標與圖精準對齊 */
  border: var(--line-mid) solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  cursor: crosshair;
  touch-action: manipulation;
}
.hs-stage:focus-visible { outline: var(--line-bold) solid var(--accent); outline-offset: 3px; }
.hs-stage > img,
.hs-stage > svg { display: block; max-width: 100%; height: auto; }

/* 學生放下的標記；用 --x/--y 百分比定位，縮放後仍對齊 */
.hs-mark {
  position: absolute;
  left: var(--x); top: var(--y);
  width: 48px; height: 48px;
  margin: -24px 0 0 -24px;
  border-radius: 50%;
  border: var(--line-bold) solid var(--accent);
  background: var(--accent-soft);
  display: grid; place-items: center;
  font-size: 24px; line-height: 1;
  font-weight: var(--fw-bold);
  color: var(--accent);
  pointer-events: none;
}
.hs-mark.is-correct { border-color: var(--correct); background: var(--correct-soft); color: var(--correct); }
.hs-mark.is-correct::after { content: "✓"; }
.hs-mark.is-wrong { border-color: var(--wrong); background: var(--wrong-soft); color: var(--wrong); }
.hs-mark.is-wrong::after { content: "✗"; }

/* 對答案後才顯示的正解圈 */
.hs-target {
  position: absolute;
  left: var(--x); top: var(--y);
  border-radius: 50%;
  border: var(--line-bold) dashed var(--correct);
  transform: translate(-50%, -50%);
  pointer-events: none;
  display: none;
}
.hotspot.is-revealed .hs-target { display: block; }

/* ============================================================
   RWD：教學網頁在手機／平板／投影機都要能讀
   斷點語意 —— 1024：平板橫；768：平板直／小筆電；480：手機
   字級只降到 --t-min(24px) 為止，不再往下（後排學生可讀性優先）
   ============================================================ */
@media (max-width: 1024px) {
  :root {
    --t1: 60px; --t2: 46px; --t3: 34px; --t4: 28px;
    --s7: 64px; --s6: 48px;
    --safe-x: 48px; --safe-y: 40px;
  }
}
@media (max-width: 768px) {
  :root {
    --t1: 46px; --t2: 36px; --t3: 30px; --t4: 26px;
    --s7: 40px; --s6: 32px; --s5: 28px;
    --safe-x: 24px; --safe-y: 24px;
  }
  /* 並排結構一律改直排，避免擠成無法閱讀的窄欄 */
  .compare-pair,
  .misconception,
  .flow-steps,
  .figure-block { grid-template-columns: 1fr !important; }
  .quiz > .q-options { grid-template-columns: 1fr; }
  .drag-match .zones { grid-template-columns: 1fr; }
  .timeline { padding-left: var(--s4); }
  /* 數據聚焦頁：窄螢幕改上下堆疊，大數字降階 */
  .data-focus { grid-template-columns: 1fr !important; text-align: center; justify-items: center; }
  :root { --num-xl: 110px; }
  .section-divider { padding: var(--s5) var(--s5); }
}
@media (max-width: 480px) {
  :root { --t1: 38px; --t2: 32px; --t3: 28px; --t4: 25px; --num-xl: 80px; }
  .quiz, .order-q, .hotspot, .concept-card, .task-card { padding: var(--s3); }
  .order-item { flex-wrap: wrap; }
  /* 手機上工具列按鈕改為可換行，不要橫向溢出 */
  .ds-btn { flex: 1 1 auto; }
}

/* 觸控裝置：hover 效果會「黏住」，關掉純 hover 的視覺變化 */
@media (hover: none) {
  .q-opt:hover, .order-item > .move:hover, .ds-btn:hover { border-color: var(--line); }
  .q-opt.is-picked:hover { border-color: var(--accent); }
}

@media print {
  .quiz .ds-btn, .order-q .ds-btn, .hotspot .ds-btn { display: none !important; }
  .order-item > .move { display: none !important; }
  .hs-stage { cursor: default; }
  .ans-feedback { display: none !important; }
}

/* 鍵盤操作時的預覽標記（方向鍵移動、Enter 才真正放下） */
.hs-mark.is-ghost { opacity: .55; border-style: dashed; }
.hs-mark.is-ghost::after { content: none; }

/* 按鈕列：手機上自動換行，不橫向溢出 */
.row { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
/* 單檔頁面用：非簡報頁面不需要 16:9 舞台，改為可捲動文件 */

 {t:"③ 把四張圖連起來",q:"選嘉南平原，從冬天按到夏天。冬天雨很少，田裡的水從哪裡來？夏天又有什麼不同？",s:3,l:"prod",p:7,a:"冬天靠水庫把水送到田裡；夏天雨多又熱，水稻長得快。地形平、雨量和氣溫一起決定種什麼。"}
];
let taskI=0,taskShow=false;
function task(){const k=TASKS[taskI];$("#pTask").innerHTML=TASKS.map((x,i)=>`<button class="tk" data-t="${i}" aria-pressed="${i===taskI}">${x.t}</button>`).join("")+`<div class="q">${k.q}</div><button class="reveal" id="rv">${taskShow?"收起答案":"看答案"}</button><div class="ans${taskShow?" show":""}" data-after-answer aria-hidden="${!taskShow}">${k.a}</div>`;
 $("#pTask").querySelectorAll(".tk").forEach(b=>b.onclick=()=>runTask(+b.dataset.t));$("#rv").onclick=()=>{taskShow=!taskShow;task()}}
function runTask(i){taskI=i;taskShow=false;stopPlay();setSeason(TASKS[i].s);setLayer(TASKS[i].l);state.place=TASKS[i].p;refreshPins();card();task()}
function setSeason(s){state.s=s;for(let i=0;i<4;i++)WT[i]=i===s?1:0;document.querySelectorAll(".sea").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.s===s));$("#windA").textContent=WIND[s][0];$("#windT").textContent=WIND[s][1];refreshPins();legend();card()}
function setLayer(l){state.layer=l;const a={prod:0,terrain:1,temp:2,rain:3}[l];for(let i=0;i<4;i++)LT[i]=i===a?1:0;document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.layer===l));refreshPins();legend();card()}
function selectPlace(i){state.place=i;refreshPins();card();showPane("card")}
function showPane(n){document.querySelectorAll(".ptab").forEach(b=>b.setAttribute("aria-selected",b.dataset.p===n));$("#pCard").hidden=n!=="card";$("#pTask").hidden=n!=="task"}
let playT=null;function stopPlay(){clearInterval(playT);playT=null;$("#play").textContent="▶ 四季播放"}
$("#play").onclick=()=>{if(playT){stopPlay();return}$("#play").textContent="⏸ 暫停";playT=setInterval(()=>setSeason((state.s+1)%4),3500)};
document.querySelectorAll(".sea").forEach(b=>b.onclick=()=>{stopPlay();setSeason(+b.dataset.s)});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>setLayer(b.dataset.layer));
document.querySelectorAll(".ptab").forEach(b=>b.onclick=()=>showPane(b.dataset.p));
let flat=false;$("#vw").onclick=()=>{flat=!flat;goal=flat?{pitch:1.5,yaw:0}:{pitch:1.05,yaw:0};$("#vw").textContent=flat?"立體":"俯視"};
let goal=null;
addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON"&&e.key===" ")return;const m={"1":0,"2":1,"3":2,"4":3}[e.key];if(m!==undefined){stopPlay();setSeason(m)}});
/* 拖曳旋轉、滾輪與雙指縮放 */
const ptrs=new Map();let pd=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);goal=null});
cv.addEventListener("pointermove",e=>{const o=ptrs.get(e.pointerId);if(!o)return;const dx=e.clientX-o[0],dy=e.clientY-o[1];ptrs.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptrs.size===1){state.yaw-=dx*.006;state.pitch=Math.max(.45,Math.min(1.5,state.pitch+dy*.005))}
 else if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)state.dist=Math.max(1.4,Math.min(4.6,state.dist*pd/d));pd=d}});
const up=e=>{ptrs.delete(e.pointerId);pd=0};cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();state.dist=Math.max(1.4,Math.min(4.6,state.dist*(1+e.deltaY*.001)))},{passive:false});
addEventListener("resize",resize);
function loop(ms){if(goal){state.pitch+=(goal.pitch-state.pitch)*.08;state.yaw+=(goal.yaw-state.yaw)*.08}draw(ms/1000);requestAnimationFrame(loop)}
/* 啟動 */
buildPins();
if(!gl){$("#nogl").style.display="flex";$("#gl").style.display="none";$("#pins").style.display="none"}
else{prog=pr(VS,FS);pprog=pr(PVS,PFS);for(const n of["uM","uW","uL","uTime"])uni[n]=gl.getUniformLocation(prog,n);for(const n of["uM","uW","uTime","uFx","uPx","uWind"])puni[n]=gl.getUniformLocation(pprog,n);
 gl.clearColor(0,0,0,0);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);buildMesh();resize()}
setLayer("prod");setSeason(0);task();
if(gl)requestAnimationFrame(loop);
window.__map={state,PLACES,heightAt,terrainClass,rainAt,tempAt,rainWord,tempWord,setSeason,setLayer,selectPlace,runTask,showPane,placeH};
</script>
